[package]
name = "oneclient_app"
description = "Golem's Client launcher"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }

[features]
default = []

[dependencies]
oneclient_auth.workspace = true
oneclient_cluster.workspace = true
oneclient_common.workspace = true
oneclient_content.workspace = true
oneclient_events.workspace = true
oneclient_java.workspace = true
oneclient_mc.workspace = true
oneclient_polyplus.workspace = true
oneclient_net.workspace = true
oneclient_core.workspace = true
oneclient_db.workspace = true
chrono.workspace = true
oneclient_macro = { workspace = true, features = ["freya"] }

accesskit.workspace = true
polyio.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
tokio.workspace = true
uuid.workspace = true
bytes.workspace = true
sys-locale.workspace = true
sysinfo.workspace = true
inventory.workspace = true

notify.workspace = true

anyhow.workspace = true
regex.workspace = true
directories.workspace = true
dunce.workspace = true
percent-encoding.workspace = true

cargo-packager-updater = "=0.2.3"

# rfd = "=0.17.2"
# open = "=5.4.0"
rfd.workspace = true
open.workspace = true
url.workspace = true

# clipboard image copy + decode for it
arboard.workspace = true
image.workspace = true

freya-skia-safe.workspace = true
plusrenderer.workspace = true
freya.workspace = true
freya-core.workspace = true
pulldown-cmark.workspace = true
# inlines svg logos embedded in markdown badges as data urls
base64.workspace = true

[dev-dependencies]
freya-testing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = "=0.1.52"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
freya-winit.workspace = true
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"

[package.metadata.packager]
product-name = "Golem's Client"
identifier = "dev.golemsutils.GolemsClient"
category = "Game"
publisher = "veno15"
copyright = "© 2026 veno15. Based on OneClient by Polyfrost (GPL-3.0)."
homepage = "https://github.com/VenoServices11/golems-client"
long-description = "Golem's Client, a Minecraft launcher by veno15, based on OneClient by Polyfrost"
formats = ["nsis"]
binaries = [{ path = "oneclient_app", main = true }]
icons = [
  "icons/32x32.png",
  "icons/64x64.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.ico",
]
resources = [
  # >>> CRT_RESOURCES >>>
  # <<< CRT_RESOURCES <<<
]

[package.metadata.packager.windows]
digest-algorithm = "sha256"
timestamp-url = "https://timestamp.digicert.com"

[package.metadata.packager.nsis]
preinstall-section = """
Section "-GolemsClientCleanup"
  ; Stale Tauri root start-menu shortcut (this build only writes the sub-folder one).
  Delete "$SMPROGRAMS\\${PRODUCTNAME}.lnk"
  ; Old Tauri main binary (renamed OneClient.exe -> oneclient_app.exe). Locked while
  ; the outdated app is running during an auto-update, so fall back to reboot removal.
  Delete /REBOOTOK "$INSTDIR\\OneClient.exe"
SectionEnd

; >>> VC_REDIST_SECTION >>>
Section "-VCRedist"
  SetRegView 64
  ReadRegDWORD $R0 HKLM "SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\X64" "Installed"
  ReadRegDWORD $R1 HKLM "SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\X64" "Minor"
  SetRegView lastused

  ${If} $R0 == 1
  ${AndIf} $R1 >= 40
    Goto vcredist_done
  ${EndIf}

  ${If} $PassiveMode != 1
    MessageBox MB_OK|MB_ICONEXCLAMATION "This build of Golem's Client needs the Microsoft Visual C++ Redistributable (x64) 14.40 or newer. Install it from https://aka.ms/vs/17/release/vc_redist.x64.exe, then run this installer again."
  ${EndIf}

  vcredist_done:
SectionEnd
; <<< VC_REDIST_SECTION <<<
"""
