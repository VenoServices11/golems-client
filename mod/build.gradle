plugins {
    id 'fabric-loom' version "${loom_version}"
    // OneClient's lobby (ported from PolyPlus) is written in Kotlin
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'org.jetbrains.kotlin.plugin.serialization' version "${kotlin_version}"
}

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Polyfrost'; url = 'https://repo.polyfrost.org/releases' } }
        filter { includeGroup 'org.polyfrost.oneconfig'; includeGroup 'org.polyfrost' }
    }
    mavenCentral()
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // the Kotlin runtime (with coroutines and serialization); every Golem's Client bundle ships it
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    // only the lobby's compatibility hooks look at these, when they're installed
    // OneConfig's settings (comes with OneClient's mods): Golem's Client's mod menu shows and edits them
    compileOnly("org.polyfrost.oneconfig:config:1.9.1") { transitive = false }
    compileOnly("org.polyfrost.oneconfig:config-impl:1.9.1") { transitive = false }
    modCompileOnly("maven.modrinth:sodium:${project.sodium_version}") { transitive = false }
    modCompileOnly("maven.modrinth:iris:${project.iris_version}") { transitive = false }
    // skips the Sodium and Iris hooks when those mods aren't there
    implementation(include("com.moulberry:mixinconstraints:1.1.0"))
}

processResources {
    inputs.property "version", project.mod_version
    inputs.property "minecraft", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version, "minecraft": inputs.properties.minecraft
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// "Dev screenshots" workflow: ./gradlew runClient -Pdevshots walks through the screens and saves screenshots.
loom {
    runs {
        client {
            if (project.hasProperty('devshots')) {
                vmArg "-Dgolemsclient.devshots=true"
                // the virtual screen's software OpenGL (Mesa) crashes in shader linking with jemalloc; LWJGL's debug
                // allocator avoids it (this is only for the screenshot runs)
                vmArg "-Dorg.lwjgl.util.DebugAllocator=true"
                if (project.hasProperty('noText')) vmArg "-Dgolemsclient.debug.noText=true"
                if (project.hasProperty('noPictures')) vmArg "-Dgolemsclient.debug.noPictures=true"
                if (project.hasProperty('noShapes')) vmArg "-Dgolemsclient.debug.noShapes=true"
                programArgs "--width", "1600", "--height", "900"
            }
        }
    }
}

// the dev screenshots run with OneConfig too, so the mod menu's OneConfig pages can be checked
if (project.hasProperty('devshots')) {
    dependencies {
        modLocalRuntime("org.polyfrost.oneconfig:1.21.11-fabric:1.9.1") { exclude group: 'net.fabricmc', module: 'fabric-language-kotlin' }
        modLocalRuntime("org.polyfrost:polycompose-1.21.11-fabric:3.0.2") { exclude group: 'net.fabricmc', module: 'fabric-language-kotlin' }
    }
}
