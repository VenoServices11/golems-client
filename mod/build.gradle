plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.mod_version
    inputs.property "minecraft", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version, "minecraft": inputs.properties.minecraft
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// "Dev screenshots" workflow: ./gradlew runClient -Pdevshots walks through the screens and saves screenshots.
loom {
    runs {
        client {
            if (project.hasProperty('devshots')) {
                vmArg "-Dgolemsclient.devshots=true"
                programArgs "--width", "1600", "--height", "900"
            }
        }
    }
}
