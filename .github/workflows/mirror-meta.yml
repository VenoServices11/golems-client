name: Copy version files

# One-time copy of the game and Fabric loader version files into the data branch (meta/), from the
# metadata server Golem's Client used before it had its own copy. Skips itself once meta/ exists, so
# it never overwrites the copy; this workflow is removed once the copy is made.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mirror-meta.yml
      - .github/scripts/mirror_meta.py

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Copy
        run: |
          if [ -d data/meta ]; then
            echo "::notice::meta/ is already on the data branch; nothing to do."
            exit 0
          fi
          python3 .github/scripts/mirror_meta.py data/meta "https://meta.polyfrost.org" \
            "https://raw.githubusercontent.com/${{ github.repository }}/data/meta"
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta
          git commit -qm "Game and Fabric version files"
          git push origin HEAD:data
