name: Dev screenshots
# Manual only: starts Minecraft with the Golem's Client mod on a virtual screen, walks through its screens and saves
# screenshots (overlay included) to the "devshots" release, plus the game log. Used to check layouts.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Virtual screen and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: Skip first-launch screens
        run: |
          mkdir -p run
          printf "onboardAccessibility:false\nnarrator:0\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\nsoundCategory_master:0.0\n" > run/options.txt
      - name: Run the game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: |
          chmod +x gradlew
          timeout 1500 xvfb-run -a -s "-screen 0 1600x900x24" ./gradlew runClient -Pdevshots --no-daemon -q || echo "game exited with $?"
      - name: What happened
        if: always()
        run: |
          ls -la run/devshots || true
          for f in run/hs_err*.log; do [ -f "$f" ] && sed -n '1,80p' "$f" && grep -E "^(j|J|C|V)  " "$f" | head -60; done || true
          grep -iE "mixin|exception|error|devshots|crash|golem" run/logs/latest.log | head -150 || true
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p run/devshots
          gh release view devshots >/dev/null 2>&1 || gh release create devshots --prerelease --title "Dev screenshots" --notes "Screens captured by the Dev screenshots workflow."
          for a in $(gh release view devshots --json assets --jq '.assets[].name'); do gh release delete-asset devshots "$a" -y; done
          cp run/logs/latest.log run/devshots/latest.log 2>/dev/null || true
          ls run/crash-reports/*.txt >/dev/null 2>&1 && cp run/crash-reports/*.txt run/devshots/ || true
          cp run/hs_err*.log run/devshots/ 2>/dev/null || true
          gh release upload devshots run/devshots/* --clobber || true
