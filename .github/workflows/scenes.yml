name: Make lobby scenes
# Manual only: starts Minecraft with the Golem's Client mod on a virtual screen, finds a snowy village, a cherry grove,
# a desert village, a taiga village, a plains village and a lush cave, captures each as a lobby scene, and uploads the
# scenes with a preview picture of each to the "scenes" release.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "World seed"
        required: false
        default: "1234567890123"
permissions:
  contents: write
jobs:
  scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Virtual screen and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: Settings
        run: |
          mkdir -p run
          printf "onboardAccessibility:false\nnarrator:0\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\nsoundCategory_master:0.0\nrenderDistance:8\nsimulationDistance:8\n" > run/options.txt
      - name: Make the scenes
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: |
          chmod +x gradlew
          timeout 2700 xvfb-run -a -s "-screen 0 1600x900x24" ./gradlew runClient -Pmakescenes -Dgolemsclient.makescenes.seed=${{ inputs.seed }} --no-daemon -q || echo "game exited with $?"
      - name: What happened
        if: always()
        run: |
          ls -la run/scenes || true
          grep -E "SceneMaker|Exception|ERROR" run/logs/latest.log | grep -v "authlib\|Realms\|narrator\|flite" | head -80 || true
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p run/scenes
          gh release view scenes >/dev/null 2>&1 || gh release create scenes --prerelease --title "Lobby scenes" --notes "Scenes made by the Make lobby scenes workflow."
          for a in $(gh release view scenes --json assets --jq '.assets[].name'); do gh release delete-asset scenes "$a" -y; done
          cp run/logs/latest.log run/scenes/latest.log 2>/dev/null || true
          gh release upload scenes run/scenes/* --clobber || true
