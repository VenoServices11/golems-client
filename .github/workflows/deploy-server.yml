name: Deploy server

# Deploys server/ to Cloudflare Workers whenever it changes (or by hand).
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see server/README.md).
on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/deploy-server.yml
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN isn't set, so the server wasn't deployed. See server/README.md."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Check the server answers
        if: steps.secrets.outputs.ok == 'true'
        run: |
          sleep 5
          curl -sS -m 30 https://c418-presence.c418client.workers.dev/launcher/announcement; echo
          echo "Mojang from the server:"; curl -sS -m 30 https://c418-presence.c418client.workers.dev/health/mojang; echo
