name: Build mod

# Builds the Golem's Client mod (mod/). On main it's published to the "mod" release, with mod.json telling the
# launcher which jar goes with which Minecraft version (the launcher keeps every instance on the latest one).
on:
  push:
    paths:
      - mod/**
      - .github/workflows/mod.yml
  workflow_dispatch:

concurrency:
  group: mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mod-gradle-${{ hashFiles('mod/**/*.gradle', 'mod/gradle.properties', 'mod/gradle/wrapper/*') }}
          restore-keys: mod-gradle-
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon --stacktrace
      - name: Collect
        id: collect
        run: |
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          mkdir -p dist
          cp "$jar" "dist/golems-client-mod-$mc.jar"
          sha1=$(sha1sum "dist/golems-client-mod-$mc.jar" | cut -d' ' -f1)
          size=$(stat -c %s "dist/golems-client-mod-$mc.jar")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/mod/golems-client-mod-$mc.jar"
          printf '{\n  "version": "%s",\n  "builds": {\n    "%s": {"url": "%s", "sha1": "%s", "size": %s}\n  }\n}\n' \
            "$version" "$mc" "$url" "$sha1" "$size" > dist/mod.json
          cat dist/mod.json
      - uses: actions/upload-artifact@v4
        with:
          name: golems-client-mod
          path: mod/dist/*
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mod >/dev/null 2>&1 || gh release create mod --prerelease --title "Golem's Client mod" \
            --notes "The Golem's Client mod. The launcher downloads it by itself; you don't need to install it."
          gh release upload mod dist/* --clobber
